# Cloud Build trigger: run the tests on every push to main, and on every PR.
#
# ---------------------------------------------------------------------------
# One manual step first
# ---------------------------------------------------------------------------
# Cloud Build reaches a private repository through its own GitHub App, and
# installing that app is an OAuth flow — a browser, a GitHub login, and a
# consent screen. There is no headless equivalent, so this part is yours:
#
#   1. https://console.cloud.google.com/cloud-build/triggers?project=pingpulse-508212
#   2. "Connect repository" -> GitHub (Cloud Build GitHub App)
#   3. Authorise, pick LilyLawliet/pingpulse, and Connect.
#
# Then create both triggers from this file:
#
#   gcloud builds triggers import --source=deploy/cloudbuild-trigger.yaml \
#     --project=pingpulse-508212
#
# Check it took:
#
#   gcloud builds triggers list --project=pingpulse-508212
#
# And to prove it end to end, push anything to main and watch:
#
#   gcloud builds list --limit=1 --project=pingpulse-508212
#
# ---------------------------------------------------------------------------
# Why two triggers
# ---------------------------------------------------------------------------
# The push trigger tells you main is broken. The pull-request trigger tells you
# before it is — which is the one that actually saves an evening, since a red
# main has already been merged by the time anyone looks.
#
# Neither deploys. Deployment stays a deliberate `./push.sh` from a machine
# with credentials: a CI account able to reach production is a much larger
# blast radius than this buys back, and the deploy is already one command.

triggers:
  - name: tests-on-main
    description: Backend tests and a dashboard build on every push to main
    github:
      owner: LilyLawliet
      name: pingpulse
      push:
        branch: ^main$
    filename: cloudbuild.yaml
    includedFiles:
      # A release that only moves an installer, or a docs edit, does not need
      # the suite run against it.
      - backend/**
      - frontend/**
      - scripts/**
      - services/**
      - cloudbuild.yaml

  - name: tests-on-pull-request
    description: The same checks before anything reaches main
    github:
      owner: LilyLawliet
      name: pingpulse
      pullRequest:
        branch: ^main$
        # Run on a contributor's PR without waiting for an owner to click.
        # Safe here because the build has no secrets and no deploy rights; on a
        # build that could reach production this would be the wrong setting.
        commentControl: COMMENTS_DISABLED
    filename: cloudbuild.yaml
