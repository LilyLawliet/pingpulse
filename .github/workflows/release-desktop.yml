# Build, sign and publish a desktop release when a version tag is pushed.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Clients running the app pick the update up on their next launch. Nobody
# downloads an installer again after their first one.
#
# ---------------------------------------------------------------------------
# One-time setup
# ---------------------------------------------------------------------------
# Add these repository secrets:
#
#   TAURI_SIGNING_PRIVATE_KEY           contents of .secrets/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  empty string (the key has no password)
#
# The private key is what proves an update genuinely came from you. Anyone who
# has it can push code to every client machine, and losing it means no existing
# client can ever be updated again — they would each need a manual reinstall.
# It is gitignored; keep the copy on D: safe.
#
# No code-signing certificate is involved. Update packages are verified against
# the minisign public key compiled into the app, which is a different mechanism
# from Windows Authenticode.

name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.1.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
        # A cold Tauri build is about five minutes; cached it is well under one.

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the bundle so the installer knows which backend to call.
          VITE_API_BASE_URL: https://pingpulse.duckdns.org
        with:
          tagName: v${{ steps.version.outputs.value }}
          releaseName: PingPulse ${{ steps.version.outputs.value }}
          releaseBody: |
            Install once and the app keeps itself up to date.

            New clients: download `PingPulse_Setup.exe` below.
            Existing clients: nothing to do — this arrives on next launch.
          releaseDraft: false
          prerelease: false
          # Writes latest.json alongside the installer, which is the file the
          # app polls. Without it clients never learn a release exists.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
