# Continuous integration on Cloud Build.
#
#   gcloud builds submit --config cloudbuild.yaml .
#
# Why here and not GitHub Actions: the account's Actions runners are locked
# behind a billing issue, and every run failed at zero seconds with no output.
# Cloud Build connects to the same private repository through its own GitHub
# App, has a free tier far larger than this suite needs, and runs in the project
# the service is already deployed in.
#
# What it does not do, so nobody goes looking: Cloud Build runs Linux containers
# only. It cannot build the Windows installer or the macOS app — those still
# build locally, and a macOS bundle still needs a Mac. This is CI for the code,
# not for the desktop releases.
#
# The two steps run in parallel. Neither depends on the other, and a broken JSX
# file should not be hidden behind a slow pip install.

steps:
  # ----------------------------------------------------------------- backend
  - id: tests
    name: python:3.13-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --no-cache-dir -r backend/requirements.txt
        cd backend && python -m pytest tests -q
        # A green suite says nothing about what it would catch. Each booking
        # fault fixed since the September 30 readiness test is put back, one
        # at a time, and the build fails if no test notices one. It caught
        # coverage moving during a rewrite that left the suite green.
        python tests/mutate_booking.py --together \
          tests/test_readiness_replay.py tests/test_readiness_report.py \
          tests/test_confirm_before_booking.py tests/test_sandbox_booking.py \
          tests/test_calendar_turns.py tests/test_booking_conversation.py \
          tests/test_scope.py tests/test_followup_is_sent_once.py \
          tests/test_bad_details_stop_the_booking.py \
          tests/test_no_order_on_record.py \
          tests/test_multi_turn_adversarial.py \
          tests/test_the_shop_decides_what_it_does.py \
          tests/test_a_time_is_never_said_to_be_theirs.py \
          tests/test_a_refusal_outlives_the_window.py \
          tests/test_good_contact_details_are_kept.py \
          tests/test_a_booked_kind_is_one_the_shop_has.py

  # ---------------------------------------------------------------- frontend
  # A build, not a lint. The dashboard has no test suite, so this catches what
  # actually breaks it: a bad import, a syntax error, a component referenced
  # before it exists. All three have shipped from this repository before.
  - id: dashboard
    name: node:20-slim
    entrypoint: bash
    waitFor: ['-']
    args:
      - -c
      - |
        set -euo pipefail
        cd frontend
        npm ci --no-audit --no-fund
        npm run build

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# Generous: a cold pip install of the backend requirements dominates the run.
timeout: 1200s
